<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NovaShop - Catálogo Digital</title>
<link rel="stylesheet" href="https://googleapis.com">
<style>
:root{--hd:"Cormorant Garamond","Playfair Display",Georgia,serif;--bg:#f7f3ec;--card:#fffdf9;--tx:#1b1814;--mu:#7a7266;--ac:#9a7b2f;--on:#fff;--bd:#e4dccb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0d0b;--card:#17150f;--tx:#f1ebdd;--mu:#a59d8b;--ac:#d4af37;--on:#14110a;--bd:#2e2a20;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0d0b;--card:#17150f;--tx:#f1ebdd;--mu:#a59d8b;--ac:#d4af37;--on:#14110a;--bd:#2e2a20;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:80px}
.w{max-width:1000px;margin:0 auto;padding:16px}
.hero{text-align:center;padding:46px 16px 34px;border-bottom:1px solid var(--bd);background:radial-gradient(ellipse at top,color-mix(in srgb,var(--ac) 16%,transparent),transparent 70%);position:relative}
.rule{width:64px;height:1px;background:var(--ac);margin:14px auto}.hero .sub{letter-spacing:.12em;text-transform:uppercase;font-size:.78rem}
h1{margin:0;font-family:var(--hd);font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:clamp(1.7rem,6vw,2.8rem)}.sub{color:var(--mu);margin:2px 0 0}
button,input,textarea,select{font:inherit;color:inherit}
.b{background:var(--ac);color:var(--on);border:0;border-radius:4px;padding:10px 18px;cursor:pointer;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem;transition:opacity .2s}
.b:hover{opacity:.9}.b:disabled{opacity:.5;cursor:wait}.b.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}.b.d{background:#dc2626;color:#fff}.b.s{padding:6px 12px;font-size:.75rem}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
label{display:block;margin:10px 0 4px;font-size:.85rem;color:var(--mu)}
.bar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}.bar input{flex:1;min-width:160px}.bar select{width:auto}
.adm{background:var(--ac);color:var(--on);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:8}
.adm .b{background:var(--on);color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,border-color .25s,box-shadow .25s}.c:hover{transform:translateY(-4px);border-color:var(--ac);box-shadow:0 10px 26px #0003}
.im{aspect-ratio:4/5;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:3rem;position:relative;overflow:hidden}
.im img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;top:8px;left:8px;background:#dc2626;color:#fff;padding:2px 10px;border-radius:99px;font-size:.72rem;font-weight:600}
.i{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}.i h3{margin:0;font-family:var(--hd);font-size:1.25rem;font-weight:600}.i p{margin:0;color:var(--mu);font-size:.86rem}
.pr{font-weight:700;font-size:1.05rem;color:var(--ac);letter-spacing:.04em}.row{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap;padding-top:6px}
.cb{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 4px 14px #0004;z-index:7;border-radius:99px;padding:12px 20px}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:9;backdrop-filter:blur(2px)}
.m{background:var(--bg);width:100%;max-width:500px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px;border:1px solid var(--bd)}
@media(min-width:600px){.ov{align-items:center}.m{border-radius:18px}}
.ln{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.em{text-align:center;color:var(--mu);padding:40px 10px}
#qr{display:flex;justify-content:center;background:#fff;padding:14px;border-radius:12px;margin:12px 0}
.top-tools{position:absolute;top:12px;right:12px;display:flex;gap:6px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>

<script src="https://cloudflare.com"></script>
<script>
const DB_URL = "https://googleapis.com";

let S = {
  store: {
    name: "NovaShop",
    tagline: "Productos variados al mejor precio",
    wa: "81076218",
    cur: "C$"
  },
  products: [
    {
      id: "p1",
      name: "Reloj Clásico Dorado",
      price: 850,
      cat: "Accesorios",
      desc: "Diseño elegante resistente al agua, correa ajustable.",
      tag: "Nuevo",
      img: ""
    },
    {
      id: "p2",
      name: "Audífonos Inalámbricos Pro",
      price: 650,
      cat: "Tecnología",
      desc: "Sonido nítido, estuche de carga rápida y micrófono integrado.",
      tag: "Oferta",
      img: ""
    }
  ]
};

try {
  const cached = localStorage.getItem('novashop_cache');
  if (cached) S = JSON.parse(cached);
} catch (e) {}

let admin = false, cart = {}, q = '', cat = '', saving = false;
try { cart = JSON.parse(localStorage.getItem('novashop_cart') || '{}') || {}; } catch (e) {}

const $ = s => document.querySelector(s);
const app = $('#app'), mod = $('#modal');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const saveCart = () => { try { localStorage.setItem('novashop_cart', JSON.stringify(cart)); } catch (e) {} };
const money = n => `${esc(S.store.cur)} ${Number(n || 0).toLocaleString('es-NI')}`;

async function loadCloud() {
  try {
    const res = await fetch(DB_URL + "?t=" + Date.now());
    if (res.ok) {
      const data = await res.json();
      if (data.fields && data.fields.payload && data.fields.payload.stringValue) {
        S = JSON.parse(data.fields.payload.stringValue);
        localStorage.setItem('novashop_cache', JSON.stringify(S));
        document.title = `${S.store.name} - Catálogo Digital`;
        render();
      }
    } else if (res.status === 404) {
      await syncCloud();
    }
  } catch (e) {
    console.log("Modo sin conexión o cargando caché local");
  }
}

async function syncCloud() {
  saving = true;
  render();
  try {
    localStorage.setItem('novashop_cache', JSON.stringify(S));
    const res = await fetch(DB_URL, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        fields: {
          payload: { stringValue: JSON.stringify(S) }
        }
      })
    });
    if (!res.ok) throw new Error("Error HTTP " + res.status);
  } catch (e) {
    alert("No se pudo guardar en la nube. Revisa tu conexión a internet.");
  }
  saving = false;
  render();
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
}

function openAdmin() {
  if (admin) { admin = false; render(); return; }
  const pass = prompt("Ingresa la clave de administrador (por defecto: 1234):");
  if (pass === "1234") {
    admin = true;
    render();
  } else if (pass !== null) {
    alert("Clave incorrecta");
  }
}

function showQR() {
  const url = window.location.href;
  mod.innerHTML = `
    <div class="ov" onclick="if(event.target===this)closeMod()">
      <div class="m">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <h3 style="margin:0;font-family:var(--hd);font-size:1.5rem">Código QR de la Tienda</h3>
          <button class="b g s" onclick="closeMod()">✕</button>
        </div>
        <p class="sub">Escanea este código para abrir el catálogo desde cualquier celular.</p>
        <div id="qr"></div>
        <p style="font-size:.78rem;color:var(--mu);word-break:break-all;text-align:center">${esc(url)}</p>
        <button class="b" style="width:100%" onclick="closeMod()">Listo</button>
      </div>
    </div>`;
  if (window.QRCode) {
    new QRCode(document.getElementById("qr"), { text: url, width: 200, height: 200 });
  } else {
    document.getElementById("qr").innerHTML = "<p style='color:#000'>Copia el enlace de abajo para compartir.</p>";
  }
}

function addCart(id) {
  cart[id] = (cart[id] || 0) + 1;
  saveCart();
  render();
}

function chgQty(id, d) {
  cart[id] = (cart[id] || 0) + d;
  if (cart[id] <= 0) delete cart[id];
  saveCart();
  openCart();
  render();
}

function openCart() {
  const items = Object.entries(cart).map(([id, qty]) => {
    const p = S.products.find(x => x.id === id);
    return p ? { ...p, qty } : null;
  }).filter(Boolean);

  const total = items.reduce((sum, item) => sum + (item.price * item.qty), 0);

  mod.innerHTML = `
    <div class="ov" onclick="if(event.target===this)closeMod()">
      <div class="m">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <h3 style="margin:0;font-family:var(--hd);font-size:1.6rem">Tu Pedido</h3>
          <button class="b g s" onclick="closeMod()">✕</button>
        </div>
        ${items.length === 0 ? '<div class="em">Tu carrito está vacío. Agrega productos del catálogo.</div>' : `
          <div>
            ${items.map(it => `
              <div class="ln">
                <div>
